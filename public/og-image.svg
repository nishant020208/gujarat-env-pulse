<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07111c" />
      <stop offset="50%" stop-color="#0b1b2b" />
      <stop offset="100%" stop-color="#050d17" />
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#07111c" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Grid lines -->
  <g stroke="#10b981" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Outer Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="28" fill="none" stroke="#10b981" stroke-opacity="0.25" stroke-width="2" />

  <!-- Top Badges -->
  <g transform="translate(80, 80)">
    <rect width="360" height="40" rx="20" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="20" cy="20" r="5" fill="#10b981" />
    <text x="36" y="25" fill="#34d399" font-family="monospace" font-size="14" font-weight="bold" letter-spacing="2">GPCB · CAAQMS TELEMETRY PORTAL</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="80" y="200" fill="#ffffff" font-family="system-ui, sans-serif" font-size="56" font-weight="800" letter-spacing="-1">
    Gujarat Environment Pulse
  </text>
  
  <text x="80" y="260" fill="url(#primary)" font-family="system-ui, sans-serif" font-size="34" font-weight="700">
    Hyperlocal Pollution Evidence Engine (HPPE)
  </text>

  <text x="80" y="320" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="20" font-weight="400" width="800">
    Continuous ambient air monitoring, industrial plume dispersion modeling,
  </text>
  <text x="80" y="350" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="20" font-weight="400">
    and automated GPCB statutory enforcement docket generation.
  </text>

  <!-- Bottom Corridor Chips -->
  <g transform="translate(80, 460)">
    <g transform="translate(0, 0)">
      <rect width="180" height="52" rx="14" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="20" y="24" fill="#64748b" font-family="monospace" font-size="11" font-weight="bold">CORRIDOR 01</text>
      <text x="20" y="42" fill="#f8fafc" font-family="system-ui" font-size="15" font-weight="600">Vapi GIDC</text>
    </g>
    <g transform="translate(196, 0)">
      <rect width="210" height="52" rx="14" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="20" y="24" fill="#64748b" font-family="monospace" font-size="11" font-weight="bold">CORRIDOR 02</text>
      <text x="20" y="42" fill="#f8fafc" font-family="system-ui" font-size="15" font-weight="600">Ankleshwar Estate</text>
    </g>
    <g transform="translate(422, 0)">
      <rect width="190" height="52" rx="14" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="20" y="24" fill="#64748b" font-family="monospace" font-size="11" font-weight="bold">CORRIDOR 03</text>
      <text x="20" y="42" fill="#f8fafc" font-family="system-ui" font-size="15" font-weight="600">Dahej PCPIR</text>
    </g>
    <g transform="translate(628, 0)">
      <rect width="180" height="52" rx="14" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="20" y="24" fill="#64748b" font-family="monospace" font-size="11" font-weight="bold">CORRIDOR 04</text>
      <text x="20" y="42" fill="#f8fafc" font-family="system-ui" font-size="15" font-weight="600">Sachin GIDC</text>
    </g>
    <g transform="translate(824, 0)">
      <rect width="180" height="52" rx="14" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="20" y="24" fill="#64748b" font-family="monospace" font-size="11" font-weight="bold">CORRIDOR 05</text>
      <text x="20" y="42" fill="#f8fafc" font-family="system-ui" font-size="15" font-weight="600">Vatva Complex</text>
    </g>
  </g>

  <!-- Domain watermark bottom right -->
  <text x="1100" y="560" text-anchor="end" fill="#64748b" font-family="monospace" font-size="14" letter-spacing="1">
    https://hppe.gujarat.gov.in
  </text>
</svg>
